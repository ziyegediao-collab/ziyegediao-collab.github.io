<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Timer — Oliver</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 560px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; line-height: 1.6; text-align: center; }
  a { color: #5c46eb; }
  .modes button, .controls button { font-size: 1rem; padding: .5rem 1rem; margin: .25rem; border-radius: 999px; border: 1px solid rgba(127,127,127,.4); background: transparent; cursor: pointer; }
  .modes button.active { background: #5c46eb; color: #fff; border-color: #5c46eb; }
  #display { font-size: 5rem; font-variant-numeric: tabular-nums; margin: 1rem 0 .5rem; }
  #status { opacity: .75; min-height: 1.6em; }
  .settings, .tasks { margin-top: 2rem; text-align: left; }
  .settings label { display: flex; justify-content: space-between; margin: .4rem 0; }
  .settings input { width: 5rem; }
  .tasks li { margin: .3rem 0; }
  .tasks li.done span { text-decoration: line-through; opacity: .6; }
  #taskInput { width: 70%; padding: .45rem; }
</style>
</head>
<body>
  <p style="text-align:left"><a href="../">← Back to homepage</a></p>
  <h1>Focus Timer</h1>
  <p>A small Pomodoro timer that runs fully in your browser. Pick a mode,
     press start, and get a beep when the interval ends.</p>

  <div class="modes">
    <button data-mode="focus" class="active">Focus</button>
    <button data-mode="short">Short break</button>
    <button data-mode="long">Long break</button>
  </div>

  <div id="display">25:00</div>
  <p id="status">Ready.</p>

  <div class="controls">
    <button id="toggle">Start</button>
    <button id="reset">Reset</button>
  </div>

  <p>Focus sessions finished today: <strong id="count">0</strong></p>

  <div class="settings">
    <h2>Durations (minutes)</h2>
    <label>Focus <input type="number" id="dur-focus" min="1" max="180" value="25"></label>
    <label>Short break <input type="number" id="dur-short" min="1" max="60" value="5"></label>
    <label>Long break <input type="number" id="dur-long" min="1" max="60" value="15"></label>
  </div>

  <div class="tasks">
    <h2>Session tasks</h2>
    <input id="taskInput" placeholder="What are you working on?" maxlength="120">
    <button id="addTask">Add</button>
    <ul id="taskList"></ul>
  </div>

<script>
(function () {
  var DUR_KEY = "ft-durations", TASK_KEY = "ft-tasks", COUNT_KEY = "ft-count";
  var modes = { focus: 25, short: 5, long: 15 };
  try { Object.assign(modes, JSON.parse(localStorage.getItem(DUR_KEY) || "{}")); } catch (e) {}
  var mode = "focus", remaining = modes.focus * 60, timer = null;

  var display = document.getElementById("display"),
      status = document.getElementById("status"),
      toggle = document.getElementById("toggle"),
      countEl = document.getElementById("count");

  function todayKey() { return COUNT_KEY + "-" + new Date().toISOString().slice(0, 10); }
  function getCount() { return parseInt(localStorage.getItem(todayKey()) || "0", 10); }
  function renderCount() { countEl.textContent = getCount(); }

  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? "0" : "") + m + ":" + (r < 10 ? "0" : "") + r; }
  function render() { display.textContent = fmt(remaining); document.title = fmt(remaining) + " — Focus Timer"; }

  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.35, 0.7].forEach(function (t) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination); o.frequency.value = 880;
        g.gain.setValueAtTime(0.001, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.32);
      });
    } catch (e) {}
  }

  function stop() { clearInterval(timer); timer = null; toggle.textContent = "Start"; }
  function finish() {
    stop(); beep();
    if (mode === "focus") {
      localStorage.setItem(todayKey(), String(getCount() + 1)); renderCount();
      status.textContent = "Focus session done. Time for a break.";
      setMode(getCount() % 4 === 0 ? "long" : "short");
    } else {
      status.textContent = "Break over. Back to focus.";
      setMode("focus");
    }
  }
  function tick() { remaining--; if (remaining <= 0) { remaining = 0; render(); finish(); } else render(); }

  function setMode(m) {
    mode = m; stop(); remaining = modes[m] * 60; render();
    document.querySelectorAll(".modes button").forEach(function (b) {
      b.classList.toggle("active", b.dataset.mode === m);
    });
    status.textContent = "Ready.";
  }

  document.querySelectorAll(".modes button").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.dataset.mode); });
  });
  toggle.addEventListener("click", function () {
    if (timer) { stop(); status.textContent = "Paused."; }
    else { timer = setInterval(tick, 1000); toggle.textContent = "Pause"; status.textContent = mode === "focus" ? "Focusing…" : "On a break."; }
  });
  document.getElementById("reset").addEventListener("click", function () { setMode(mode); });

  ["focus", "short", "long"].forEach(function (m) {
    var input = document.getElementById("dur-" + m);
    input.value = modes[m];
    input.addEventListener("change", function () {
      var v = Math.max(1, parseInt(input.value || modes[m], 10));
      modes[m] = v; input.value = v;
      localStorage.setItem(DUR_KEY, JSON.stringify(modes));
      if (mode === m && !timer) { remaining = v * 60; render(); }
    });
  });

  var tasks = [];
  try { tasks = JSON.parse(localStorage.getItem(TASK_KEY) || "[]"); } catch (e) {}
  var list = document.getElementById("taskList"), taskInput = document.getElementById("taskInput");
  function saveTasks() { localStorage.setItem(TASK_KEY, JSON.stringify(tasks)); }
  function renderTasks() {
    list.innerHTML = "";
    tasks.forEach(function (t, i) {
      var li = document.createElement("li"); if (t.done) li.className = "done";
      var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!t.done;
      cb.addEventListener("change", function () { tasks[i].done = cb.checked; saveTasks(); renderTasks(); });
      var span = document.createElement("span"); span.textContent = " " + t.text + " ";
      var del = document.createElement("button"); del.textContent = "Delete";
      del.addEventListener("click", function () { tasks.splice(i, 1); saveTasks(); renderTasks(); });
      li.appendChild(cb); li.appendChild(span); li.appendChild(del); list.appendChild(li);
    });
  }
  function addTask() {
    var text = taskInput.value.trim(); if (!text) return;
    tasks.push({ text: text, done: false }); taskInput.value = ""; saveTasks(); renderTasks();
  }
  document.getElementById("addTask").addEventListener("click", addTask);
  taskInput.addEventListener("keydown", function (e) { if (e.key === "Enter") addTask(); });

  render(); renderCount(); renderTasks();
})();
</script>
</body>
</html>
